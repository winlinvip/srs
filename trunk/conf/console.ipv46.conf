# no-daemon and write log to console config for srs.
# @see full.conf for detail config.

max_connections     1000;
daemon              off;
srs_log_tank        console;

# RTMP server configuration
rtmp {
    listen              1935 [::]:1935;
}
http_api {
    enabled         on;
    listen          1985 [::]:1985;
    https {
        enabled on;
        listen 1990;
        key ./conf/server.key;
        cert ./conf/server.crt;
    }
}
http_server {
    enabled         on;
    listen          8080 [::]:8080;
    https {
        enabled on;
        listen 8088 [::]:8088;
        key ./conf/server.key;
        cert ./conf/server.crt;
    }
}
rtc_server {
    enabled on;

    # @see https://ossrs.io/lts/en-us/docs/v7/doc/webrtc#config-candidate
    candidate $CANDIDATE;
    use_auto_detect_network_ip on;
    #ip_family ipv4;
    #ip_family ipv6;
    ip_family all;
    api_as_candidates off;
    
    #protocol udp;
    #protocol tcp;
    protocol all;
    
    # UDP port - IPv4 and IPv6
    listen 8000 [::]:8000; 

    tcp {
        enabled on;
        listen 8000 [::]:8000;
    }
}
srt_server {
    enabled on;
    listen 10080;
}
vhost __defaultVhost__ {
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    rtc {
        enabled     on;
        # @see https://ossrs.io/lts/en-us/docs/v7/doc/webrtc#rtmp-to-rtc
        rtmp_to_rtc on;
        # @see https://ossrs.io/lts/en-us/docs/v7/doc/webrtc#rtc-to-rtmp
        rtc_to_rtmp on;
    }
    srt {
        enabled     on;
        srt_to_rtmp on;
    }
}
